[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excalidash-mcp"
version = "0.1.0"
description = "MCP stdio server exposing a self-hosted Excalidash REST API as Excalidraw diagram tools."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jomakori" }]
keywords = ["excalidash", "excalidraw", "mcp", "model-context-protocol", "diagrams"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.10"]

[project.scripts]
excalidash-mcp = "excalidash_mcp.server:main"

[project.urls]
Homepage = "https://github.com/jomakori/excalidash-mcp"
Repository = "https://github.com/jomakori/excalidash-mcp"
Issues = "https://github.com/jomakori/excalidash-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/excalidash_mcp"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT009"]
